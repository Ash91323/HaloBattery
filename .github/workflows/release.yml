name: Build and release

# Pushes to main publish personal releases; no bot commits are created.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halo-personal-release
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh release tags
        run: git fetch --tags origin

      - name: Prepare release version and notes
        id: release
        run: python tools/prepare_release.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Smoke test
        run: python halo_battery.pyw --probe

      - name: Build HaloBattery
        run: |
          python tools/make_icon.py halo.ico
          python tools/make_version.py version_info.txt
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name HaloBattery --icon halo.ico --version-file version_info.txt --hidden-import hid --hidden-import pystray._win32 halo_battery.pyw

      - name: Package Windows update
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $zip = "HaloBattery-$env:RELEASE_VERSION.zip"
          Compress-Archive -Path dist/HaloBattery -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HaloBattery-${{ steps.release.outputs.version }}
          path: dist/HaloBattery

      # Hide releases from the updater until all assets finish uploading.
      - name: Upload draft release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HaloBattery ${{ steps.release.outputs.tag }}
          draft: true
          prerelease: false
          files: |
            HaloBattery-${{ steps.release.outputs.version }}.zip
            HaloBattery-${{ steps.release.outputs.version }}.zip.sha256
          fail_on_unmatched_files: true
          body_path: release_notes.md

      - name: Publish completed release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false --latest --repo "$env:GITHUB_REPOSITORY"
